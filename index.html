const CHARS=[
 {name:'친구 A',skill:'슈퍼 점프',sk:'jump'},
 {name:'친구 B',skill:'순간이동',sk:'tp'}];
const WIN=7,CD=240; // 승리 점수, 스킬 쿨타임(프레임, 60 = 1초)
/* ===== 게임 로직 ===== */
const W=640,H=304,GY=248,NX=320,NT=176,PR=30,BR=18;
const BT=0.7; // 공 속도 배율 (0.7 = 30% 느리게)
function mk(x){return{x,y:GY-PR,vx:0,vy:0,hit:0,pk:0,cd:0,fx:0}}
function newState(ch){const s={t:0,sc:[0,0],ch,srv:0,ph:0,tm:60,w:0,p:[],b:{}};serve(s);return s}
function serve(s){s.p=[mk(160),mk(480)];s.b={x:s.srv?480:160,y:80,vx:0,vy:0,w:0,a:0,sq:0};s.ph=0;s.tm=60}
// 면(nx,ny)에 부딪힐 때: 반발(e)과 마찰(f)로 공이 회전을 얻음. (sx,sy)는 면의 속도
function bounce(b,nx,ny,e,f,sx,sy){
 let rx=b.vx-sx,ry=b.vy-sy;const vn=rx*nx+ry*ny;if(vn>=0)return;
 rx-=(1+e)*vn*nx;ry-=(1+e)*vn*ny;
 const tx=-ny,ty=nx,us=rx*tx+ry*ty-b.w*BR;
 rx-=f*us*tx;ry-=f*us*ty;b.w+=1.5*f*us/BR;
 b.vx=rx+sx;b.vy=ry+sy;b.sq=Math.min(1,-vn/12)}
function step(s,ins){
 s.t++;
 for(let i=0;i<2;i++){
  const p=s.p[i],k=ins[i];
  if(s.ph===3){p.vx=0;continue}
  p.vx=(((k&2)?1:0)-((k&1)?1:0))*5.5;p.x+=p.vx;
  const lo=i?NX+4+PR:PR,hi=i?W-PR:NX-4-PR;
  p.x=Math.min(hi,Math.max(lo,p.x));
  if(p.y>=GY-PR&&(k&4))p.vy=-12.5;
  p.vy+=0.6;p.y+=p.vy;
  if(p.y>GY-PR){p.y=GY-PR;p.vy=0}
  const hk=k&8;
  if(hk&&!p.pk&&p.hit<=0)p.hit=20;else if(p.hit>0)p.hit--;
  p.pk=hk?1:0;
  if(p.cd>0)p.cd--;if(p.fx>0)p.fx--;
  if((k&16)&&p.cd===0&&s.ph===1){
   const sk=CHARS[s.ch[i]].sk,b=s.b;
   if(sk==='jump'&&p.y>=GY-PR){p.vy=-16.5;p.cd=CD;p.fx=20}
   if(sk==='tp'&&(i?b.x>NX:b.x<NX)){p.x=Math.min(hi,Math.max(lo,b.x));p.cd=CD;p.fx=20}
  }
 }
 if(s.ph===0){if(--s.tm<=0)s.ph=1;return}
 ball(s);
 if(s.ph===2&&--s.tm<=0)serve(s);
}
function ball(s){
 const b=s.b;
 b.vy+=0.28*BT;
 const ax=-b.vy*b.w*0.03*BT,ay=b.vx*b.w*0.03*BT; // 회전에 의한 휘어짐(마그누스 효과)
 b.vx+=ax;b.vy+=ay;
 b.x+=b.vx*BT;b.y+=b.vy*BT;b.a+=b.w*BT;b.w*=0.997;b.sq=b.sq>0.01?b.sq*0.8:0;
 if(b.x<BR){b.x=BR;bounce(b,1,0,0.85,0.2,0,0)}
 if(b.x>W-BR){b.x=W-BR;bounce(b,-1,0,0.85,0.2,0,0)}
 if(b.y<BR){b.y=BR;bounce(b,0,1,0.85,0.2,0,0)}
 {const cx=Math.min(NX+4,Math.max(NX-4,b.x)),cy=Math.min(GY,Math.max(NT-6,b.y));
  let dx=b.x-cx,dy=b.y-cy,d2=dx*dx+dy*dy;
  if(d2<BR*BR){let d=Math.sqrt(d2);if(d<0.001){dx=0;dy=-1;d=1}
   const nx=dx/d,ny=dy/d;b.x=cx+nx*BR;b.y=cy+ny*BR;bounce(b,nx,ny,0.8,0.2,0,0)}}
 if(s.ph===1)for(let i=0;i<2;i++){
  const p=s.p[i],R=PR+BR;let dx=b.x-p.x,dy=b.y-p.y,d2=dx*dx+dy*dy;
  if(d2<R*R){
   const d=Math.sqrt(d2)||1,nx=dx/d,ny=dy/d,dir=i?-1:1;
   b.x=p.x+nx*R;b.y=p.y+ny*R;
   if(p.hit>8){const air=p.y<GY-PR-4;b.vx=dir*(air?13:10);b.vy=air?7:-10;b.w=dir*0.35;b.sq=1;p.hit=8}
   else{bounce(b,nx,ny,0.9,0.25,p.vx,p.vy);b.vx+=dir*0.8;if(b.vy>-6)b.vy=-6}
  }
 }
 const sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
 if(sp>17){b.vx*=17/sp;b.vy*=17/sp}
 if(b.y>=GY-BR){
  b.y=GY-BR;
  if(s.ph===1){const w=b.x<NX?1:0;s.sc[w]++;s.srv=w;s.w=w;s.ph=s.sc[w]>=WIN?3:2;s.tm=90}
  bounce(b,0,-1,0.55,0.2,0,0);
  if(Math.abs(b.vy)<1.2)b.vy=0;
  b.vx*=0.995;
 }
}
